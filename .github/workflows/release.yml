name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    name: build paste-buff.dmg
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Read workspace version
        id: version
        run: |
          ver="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          set -eu
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p paste-buff-appkit --target "$t"
          done
          mkdir -p dist
          lipo -create -output dist/paste-buff \
            target/aarch64-apple-darwin/release/paste-buff-appkit \
            target/x86_64-apple-darwin/release/paste-buff-appkit
          lipo -info dist/paste-buff

      - name: Bundle app
        run: packaging/bundle.sh dist/paste-buff "${{ steps.version.outputs.version }}" dist

      # Developer ID signing keeps the Accessibility grant valid across upgrades:
      # TCC pins "identifier + team" instead of the cdhash of one build. The
      # bundle identifier must never change or every user's grant breaks again.
      # Without the secrets (forks) the app is ad-hoc signed and not notarized.
      - name: Sign app, build DMG, notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          app=dist/paste-buff.app
          dmg=dist/paste-buff.dmg

          make_dmg() {
            stage="$RUNNER_TEMP/dmg"
            rm -rf "$stage" && mkdir -p "$stage"
            ditto "$app" "$stage/paste-buff.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname paste-buff -srcfolder "$stage" \
              -fs HFS+ -format ULFO -ov "$dmg"
          }

          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::no signing secrets; shipping an ad-hoc signed, unnotarized DMG"
            codesign --force --sign - "$app"
            make_dmg
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          sign() {
            codesign --force --timestamp --keychain "$keychain" \
              --sign "Developer ID Application" "$@"
          }

          sign --options runtime "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -d -r- "$app"

          make_dmg
          sign "$dmg"

          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          notary() {
            xcrun notarytool "$@" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          }
          notary submit "$dmg" --wait --timeout 30m \
            --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$status" != "Accepted" ]; then
            notary log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" || true
            echo "::error::notarization $status" >&2
            exit 1
          fi
          rm "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$keychain"

          # Staple so the DMG opens without a network round trip to Apple.
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 paste-buff.dmg > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: paste-buff-dmg
          path: |
            dist/paste-buff.dmg
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    needs: dmg
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paste-buff-dmg
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
