[workspace]
resolver = "2"
members = ["crates/*"]
# Tauri is kept for reference only; build it explicitly with `cargo build -p paste-buff-tauri`.
default-members = ["crates/paste-buff-core", "crates/paste-buff-gpui", "crates/paste-buff-appkit", "crates/paste-buff-bench"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
paste-buff-core = { path = "crates/paste-buff-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSEnumerator", "NSObject", "NSURL", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSResponder", "NSImageRep", "NSBitmapImageRep"] }
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
