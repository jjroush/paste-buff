<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paste-buff</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1c1c1e; --border: #313135; --text: #e8e8ea; --muted: #8e8e93;
    --sel: #3a3a40; --kbd: #333338;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #app { display: grid; grid-template-rows: 48px 1fr 40px; height: 100%; }
  header { display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--border); }
  header input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 18px;
  }
  header input::placeholder { color: var(--muted); }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  #list { overflow-y: auto; border-right: 1px solid var(--border); padding: 6px; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    white-space: nowrap; overflow: hidden; color: var(--text);
  }
  .row.sel { background: var(--sel); }
  .row .icon { width: 16px; text-align: center; font-size: 12px; }
  .row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .age { color: var(--muted); font-size: 12px; }
  #preview { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #text {
    padding: 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 13px "SF Mono", Menlo, monospace; user-select: text; -webkit-user-select: text; cursor: text;
  }
  #info { border-top: 1px solid var(--border); padding: 10px 14px; font-size: 13px; }
  #info h3 { color: var(--muted); font-weight: 500; font-size: 12px; margin-bottom: 6px; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }
  footer {
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    border-top: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  footer b { color: var(--text); font-weight: 500; }
  kbd { background: var(--kbd); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--text); margin-left: 6px; }
  .empty { padding: 24px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header><input id="q" placeholder="Type to filter entries…" autocomplete="off" spellcheck="false"></header>
  <main>
    <div id="list"></div>
    <div id="preview">
      <div id="text"></div>
      <div id="info"></div>
    </div>
  </main>
  <footer>
    <span>paste-buff · Tauri</span>
    <span><b id="action">Paste</b><kbd>⏎</kbd> <span style="margin-left:10px">Delete</span><kbd>⌘⌫</kbd></span>
  </footer>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let rows = [];
  let sel = 0;

  async function refresh() {
    rows = await invoke('get_history', { query: $('q').value });
    sel = Math.min(sel, Math.max(0, rows.length - 1));
    renderList();
  }

  function renderList() {
    const list = $('list');
    if (!rows.length) {
      list.innerHTML = '<div class="empty">Nothing copied in the last 24 hours</div>';
      renderPreview();
      return;
    }
    list.innerHTML = rows.map((r, i) =>
      `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}">` +
      `<span class="icon">${r.is_url ? '🔗' : '📄'}</span>` +
      `<span class="label">${esc(r.preview)}</span>` +
      `<span class="age">${r.age}</span></div>`).join('');
    renderPreview();
    scrollSelIntoView();
  }

  function setSel(i) {
    if (!rows.length) return;
    const list = $('list');
    list.children[sel]?.classList.remove('sel');
    sel = Math.max(0, Math.min(rows.length - 1, i));
    list.children[sel]?.classList.add('sel');
    renderPreview();
    scrollSelIntoView();
  }

  function scrollSelIntoView() {
    $('list').children[sel]?.scrollIntoView({ block: 'nearest' });
  }

  function renderPreview() {
    const r = rows[sel];
    if (!r) { $('text').textContent = ''; $('info').innerHTML = ''; return; }
    $('text').textContent = r.text;
    const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${esc(String(v))}</span></div>`;
    $('info').innerHTML = '<h3>Information</h3>' +
      kv('Source', r.source_app || 'Unknown') +
      kv('Content type', r.is_url ? 'Link' : 'Text') +
      kv('Characters', r.chars) + kv('Words', r.words) + kv('Lines', r.lines) +
      kv('Times copied', r.times_copied) +
      kv('Copied', `${r.bucket} · ${new Date(r.copied_at_ms).toLocaleTimeString()}`);
  }

  async function choose() {
    const r = rows[sel];
    if (r) await invoke('choose', { id: r.id });
  }

  async function removeSelected() {
    const r = rows[sel];
    if (!r) return;
    await invoke('remove', { id: r.id });
    await refresh();
  }

  $('q').addEventListener('input', () => { sel = 0; refresh(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(sel - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(); }
    else if (e.key === 'Escape') { e.preventDefault(); invoke('dismiss'); }
    else if ((e.key === 'Backspace' && e.metaKey) || e.key === 'Delete') { e.preventDefault(); removeSelected(); }
    else if (e.key === 'q' && e.metaKey) { e.preventDefault(); invoke('quit'); }
  });

  $('list').addEventListener('mousedown', (e) => {
    const row = e.target.closest('.row');
    if (row) setSel(+row.dataset.i);
  });
  $('list').addEventListener('dblclick', (e) => { if (e.target.closest('.row')) choose(); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  listen('show', async () => {
    $('q').value = '';
    sel = 0;
    const target = await invoke('target_name');
    $('action').textContent = target ? `Paste to ${target}` : 'Paste';
    await refresh();
    $('q').focus();
  });

  refresh();
</script>
</body>
</html>
